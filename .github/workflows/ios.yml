name: iOS app

# Builds the phone app and runs its tests: unit tests plus the engine
# integration suite against throwaway WebDAV/SFTP servers on the runner.
# The rclone engine comes from the engine-v<version> release made by
# rclone-mobile.yml; if that release does not exist yet it is built here.

on:
  push:
    paths:
      - 'mobile/**'
      - 'app/rclone.version'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'app/rclone.version'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch engine
        id: fetch
        continue-on-error: true
        working-directory: mobile/ios
        run: scripts/fetch-engine.sh

      - uses: actions/setup-go@v5
        if: steps.fetch.outcome == 'failure'
        with:
          go-version: 'stable'

      - name: Build engine (no release yet)
        if: steps.fetch.outcome == 'failure'
        working-directory: mobile/ios
        run: scripts/fetch-engine.sh --build

      - name: Install rclone (test servers)
        run: brew install rclone

      - name: Test
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          scripts/integration-test.sh "$DEVICE"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: mobile/ios/build/dd/Logs/Test/*.xcresult
